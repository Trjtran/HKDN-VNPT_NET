input {
  udp {
    port => 5514
    codec => plain { charset => "UTF-8" }
    tags => ["cisco_asa", "firewall"]
  }
}

filter {
  # Tách phần raw ASA và phần key=value gắn thêm sau dấu '|'
  if "|" in [message] {
    grok {
      match => {
        "message" => "^<%{POSINT:syslog_pri}>(?<syslog_time>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<device_host>\S+)\s+:\s+%ASA-%{INT:asa_sev_code}-%{INT:asa_msg_id}:\s+(?<asa_body>.*?)\s*\|\s*(?<kv_payload>.+)$"
      }
    }

    # Bóc tách các trường: event, action, severity, proto, src_ip, src_port, dst_ip, dst_port
    kv {
      source => "kv_payload"
      field_split => " "
      value_split => "="
      include_keys => [
        "event",
        "action",
        "severity",
        "proto",
        "src_ip",
        "src_port",
        "dst_ip",
        "dst_port"
      ]
    }
  }

  # Chuẩn hóa cổng: nếu là "N/A" (như ICMP) thì xóa hoặc ép về nil để không vỡ mapping số trên Elasticsearch
  if [src_port] == "N/A" or [src_port] == "" {
    mutate { remove_field => ["src_port"] }
  } else if [src_port] {
    mutate { convert => { "src_port" => "integer" } }
  }

  if [dst_port] == "N/A" or [dst_port] == "" {
    mutate { remove_field => ["dst_port"] }
  } else if [dst_port] {
    mutate { convert => { "dst_port" => "integer" } }
  }

  if [asa_sev_code] {
    mutate { convert => { "asa_sev_code" => "integer" } }
  }

  # Gắn thêm nhãn vendor cho đồng bộ dashboard/alert trên Grafana
  mutate {
    add_field => { "vendor" => "cisco_asa" }
    remove_field => ["kv_payload", "host"]
  }

  # Gắn tag cảnh báo cao phục vụ rule alert trên Grafana
  if [event] in ["firewall_deny", "icmp_sweep", "vpn_tunnel_down"] {
    mutate { add_tag => ["security_alert"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "n42-firewall-cisco-%{+YYYY.MM.dd}"
    # Nếu Elasticsearch bật security/auth thì mở 2 dòng dưới và đổi mật khẩu cho khớp docker-compose
    # user => "elastic"
    # password => "${ELASTIC_PASSWORD}"
  }

  # Bật stdout khi debug trong Docker logs; khi chạy ổn định có thể tắt bớt cho đỡ nặng log container
  stdout {
    codec => rubydebug
  }
}